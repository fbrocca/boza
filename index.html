<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mount Pleasant Zoning Map</title>
<meta name="description" content="Every variance, appeal, rezoning, annexation and sketch plan heard in Mount Pleasant, SC since 2017, on a map, with each step from Planning Commission to Town Council, the minutes, and the case documents.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="./" aria-label="Mount Pleasant Zoning Map, home">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z" fill="currentColor"/></svg>
    <span>Zoning Map</span>
  </a>
  <label class="searchbar">
    <span class="sr">Search</span>
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m21 21-4.3-4.3M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="q" type="search" placeholder="Search address, case no. (R-12-26), TMS" autocomplete="off">
  </label>
  <div class="topbar-right">
    <span class="muted small" id="stats">Loading&hellip;</span>
  </div>
</header>

<div class="layout" id="layout">
  <section class="pane" id="pane" aria-label="Cases">
    <div id="listView">
      <div class="pane-head">
        <p class="muted small" id="count">&nbsp;</p>
        <h1>Zoning cases in Mount Pleasant</h1>
        <div class="toggle-group" role="radiogroup" aria-label="Board" id="fBoard">
          <button type="button" role="radio" aria-checked="true" data-v="">All boards</button>
          <button type="button" role="radio" aria-checked="false" data-v="boza">Zoning Appeals</button>
          <button type="button" role="radio" aria-checked="false" data-v="planning">Rezoning &amp; planning</button>
        </div>
        <div class="pills">
          <label class="pill-select"><span class="sr">Outcome</span>
            <select id="fDecision"><option value="">Outcome</option></select>
          </label>
          <label class="pill-select"><span class="sr">Type</span>
            <select id="fKind"><option value="">Type of case</option></select>
          </label>
          <label class="pill-select"><span class="sr">Year</span>
            <select id="fYear"><option value="">Year</option></select>
          </label>
          <label class="pill-check"><input type="checkbox" id="fInView"><span>In map area</span></label>
          <button type="button" class="pill-reset" id="reset" hidden>Clear</button>
        </div>
      </div>
      <ol class="cards" id="results"></ol>
    </div>

    <div id="detailView" hidden>
      <div class="detail-bar">
        <button class="btn btn-ghost" id="back" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m15 18-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          All properties
        </button>
      </div>
      <div id="detail"></div>
    </div>

    <footer class="pane-foot muted small">
      Extracted automatically from the Town's
      <a href="https://sc-mountpleasant2.civicplus.com/AgendaCenter" target="_blank" rel="noopener">official minutes</a>
      (<a href="https://github.com/fbrocca/boza">method</a>). Outcomes are inferred from recorded motions; the minutes are authoritative.
    </footer>
  </section>

  <section class="mapwrap" aria-label="Map">
    <div id="map"></div>
    <details class="legend card" id="legend"></details>
  </section>
</div>

<button class="btn btn-primary map-toggle" id="mapToggle" type="button" aria-pressed="false">
  <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Zm0 0v14m6-12v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
  <span>Map</span>
</button>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/markercluster/leaflet.markercluster.js"></script>
<script src="app.js"></script>
<!-- GoatCounter: cookie-free analytics. Path excludes the query string so
     drawn boundaries (?area=...) and tester tags don't become separate pages. -->
<script>window.goatcounter = { path: function () { return location.pathname; } };</script>
<script data-goatcounter="https://fbrocca.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
