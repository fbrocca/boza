<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mount Pleasant Zoning Map</title>
<meta name="description" content="Every variance, appeal, rezoning, annexation and sketch plan heard in Mount Pleasant, SC since 2017, on a map, with each step from Planning Commission to Town Council and links to the minutes.">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="panel" id="panel" aria-label="Cases">
    <header class="panel-head">
      <div class="grip" aria-hidden="true"></div>
      <h1>Mount Pleasant Zoning Map</h1>
      <p class="sub">Zoning Appeals &middot; Planning Commission &middot; Town Council</p>
      <p class="stats" id="stats">Loading cases&hellip;</p>
    </header>

    <section id="listView" class="view">
      <div class="controls">
        <label class="search">
          <span class="sr">Search</span>
          <input id="q" type="search" placeholder="Address, case no. (R-12-26), TMS, or keyword" autocomplete="off">
        </label>
        <div class="segmented" role="radiogroup" aria-label="Board" id="fBoard">
          <button type="button" role="radio" aria-checked="true" data-v="">All</button>
          <button type="button" role="radio" aria-checked="false" data-v="boza">Zoning Appeals</button>
          <button type="button" role="radio" aria-checked="false" data-v="planning">Rezoning &amp; planning</button>
        </div>
        <div class="filters">
          <label><span>Outcome</span>
            <select id="fDecision"><option value="">All</option></select>
          </label>
          <label><span>Type</span>
            <select id="fKind"><option value="">All</option></select>
          </label>
          <label><span>Year</span>
            <select id="fYear"><option value="">All</option></select>
          </label>
        </div>
        <div class="list-meta">
          <span id="count"></span>
          <label class="inview"><input type="checkbox" id="fInView"> Only what's on the map</label>
        </div>
      </div>
      <ol class="results" id="results"></ol>
    </section>

    <section id="detailView" class="view" hidden>
      <button class="back" id="back" type="button">&larr; All properties</button>
      <div id="detail"></div>
    </section>

    <footer class="panel-foot">
      Extracted automatically from the Town's
      <a href="https://sc-mountpleasant2.civicplus.com/AgendaCenter" target="_blank" rel="noopener">official minutes</a>
      (<a href="https://github.com/fbrocca/boza">how</a>). Outcomes are inferred from the recorded motions;
      the minutes are authoritative.
    </footer>
  </aside>

  <main class="map-wrap">
    <div id="map" role="region" aria-label="Map of Mount Pleasant"></div>
    <div class="legend" id="legend" aria-label="Legend"></div>
  </main>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/markercluster/leaflet.markercluster.js"></script>
<script src="app.js"></script>
</body>
</html>
